<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Inazuma Rogue</title>
<link rel="icon" href="ui/emblem.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preload" href="ui/inapixel.ttf" as="font" type="font/ttf" crossorigin>
<style>
/* Estética del juego: fuente, colores y fondos sacados de los archivos del juego (carpeta ui/) */
@font-face{font-family:"InaPixel";src:url("ui/inapixel.ttf") format("truetype");font-display:swap}
:root{
  --night:#29295a;            /* azul marino de los menús del juego */
  --navy:#294a83;             /* relleno de botones y paneles */
  --navy-d:#182041;
  --line:#dedede;             /* borde claro de los marcos */
  --ink:#101010;              /* borde oscuro interior */
  --gold:#ffb44a;             /* texto dorado de los botones */
  --yellow:#ffe81a;
  --sky-t:#bdf6ff;            /* texto celeste de los botones naranjas */
  --orange:#ee7300; --orange-d:#8b3908;
  --cyan:#30a0c0; --teal:#103848;
  --chalk:#f4f8ff;
  --fire:#ee7300;
  --sky:#2f7de1; --rival:#e04a3a;
  --panel:rgba(24,32,65,.86);
  --panel-line:#8fb4e8;
  --e-fuego:#ff7a1a; --e-viento:#4fc8f0; --e-bosque:#5cc94a; --e-montana:#c98f42;
  --font-ui:"InaPixel","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--chalk);font-family:var(--font-ui);font-size:18px;
  -webkit-font-smoothing:none;font-smooth:never;
  overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#shell{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;max-width:520px;overflow:hidden;background:#1d4a22}
#app{position:absolute;inset:0}
#app canvas{display:block}
#touch{position:absolute;inset:0;z-index:2}
[hidden]{display:none!important}
img,.pix,.crest{image-rendering:pixelated}
.tx{text-shadow:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink)}

/* Marcador del partido (estilo barra azul del juego) */
.hud{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:flex-start;
  padding-top:calc(env(safe-area-inset-top,0px) + 6px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(60px,env(safe-area-inset-right,0px));pointer-events:none}
.score{display:flex;align-items:stretch;background:rgba(31,46,104,.88);border:2px solid var(--ink);box-shadow:0 0 0 1px var(--line);overflow:hidden;max-width:100%}
.score .team{padding:1px 4px;font-size:12px;display:flex;align-items:center;gap:3px;min-width:0}
.score .team span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:58px}
.score .team img{width:16px;height:16px;flex-shrink:0;image-rendering:pixelated}
.score .goals{padding:0 6px;font-size:18px;background:var(--navy-d);color:var(--yellow);display:flex;align-items:center;gap:4px}
.score .clock{padding:1px 6px;font-size:12px;display:flex;align-items:center;border-left:2px solid var(--ink);white-space:nowrap;color:var(--gold)}
#pauseBtn{position:absolute;z-index:6;pointer-events:auto;width:38px;height:38px;
  top:calc(env(safe-area-inset-top,0px) + 8px);right:max(16px,env(safe-area-inset-right,0px));
  background:var(--navy);border:2px solid var(--ink);box-shadow:0 0 0 2px var(--line);color:var(--gold);font:18px var(--font-ui);cursor:pointer}

#stick{position:absolute;z-index:3;width:100px;height:100px;border-radius:50%;pointer-events:none;
  border:2px solid rgba(242,246,236,.5);background:radial-gradient(circle,rgba(8,18,12,.12) 0 45%,rgba(8,18,12,.32) 46% 100%);
  box-shadow:0 0 0 1px rgba(8,18,12,.35),inset 0 0 0 1px rgba(8,18,12,.35)}
#stick::before{content:"";position:absolute;inset:6px;border-radius:50%;border:1px dashed rgba(242,246,236,.22)}
#stick.rest{left:max(22px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 30px);opacity:.45}
#stick.live{transform:translate(-50%,-50%);opacity:.95}
#knob{position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,rgba(220,230,215,.92) 60%,rgba(170,185,165,.92));border:2px solid rgba(8,18,12,.55)}
#stick.sprint #knob{background:radial-gradient(circle at 35% 30%,#ffe2b0,var(--fire) 65%);border-color:#7a2d00}
#stick.sprint{border-color:rgba(255,160,60,.75)}

/* Botones en arco alrededor de Tiro (a mano del pulgar derecho y lejos del joystick): Pase y Regate/Cambiar suben en diagonal */
#pad,.padbox{position:absolute;z-index:3;width:240px;height:240px;transform:scale(var(--padk,1));transform-origin:100% 100%;
  right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 22px)}
.act{position:absolute;border-radius:50%;border:2px solid rgba(236,242,255,.85);box-shadow:inset 0 0 0 2px rgba(10,18,40,.8),0 2px 0 rgba(0,0,0,.35);
  background:radial-gradient(circle at 50% 35%,rgba(70,108,180,.86),rgba(30,52,110,.86));color:var(--chalk);
  font-family:var(--font-ui);font-size:13px;line-height:1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  cursor:pointer;touch-action:none;transition:transform .08s,filter .08s;padding:0;overflow:hidden;text-shadow:1px 1px 0 rgba(0,0,0,.6)}
.act small{font-size:10px;opacity:.85;max-width:88%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act.down{transform:scale(.9);filter:brightness(1.25)}
.act.big{width:92px;height:92px;right:0;bottom:0;font-size:21px;color:var(--gold);border-width:3px}
.act.s2{width:70px;height:70px;right:116px;bottom:11px;font-size:15px}
.act.s3{width:72px;height:72px;right:10px;bottom:115px}
.act.s4{width:58px;height:58px;right:97px;bottom:84px;font-size:13px}
.act.s5{width:60px;height:60px;right:97px;bottom:84px;font-size:13px}   /* Regate / Cambiar: donde estaba Profund. */
.act.s6{width:40px;height:40px;right:0;bottom:194px;font-size:19px;padding:0}
.act.s3 .tt{font-size:11px;opacity:.9}
.act.s3 .tn{font-size:10px;line-height:1.1;white-space:normal;text-overflow:clip;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-width:86%;opacity:1;color:#fff}
.act.fire{border-color:#ffd08a;background:rgba(238,115,0,.82)}
.act.fire[data-elem="viento"]{border-color:var(--e-viento);background:rgba(10,70,100,.82)}
.act.fire[data-elem="bosque"]{border-color:var(--e-bosque);background:rgba(20,80,20,.82)}
.act.fire[data-elem="montaña"]{border-color:var(--e-montana);background:rgba(90,56,18,.82)}
.act.fire::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:conic-gradient(rgba(0,0,0,.62) calc(var(--cd,0) * 360deg),transparent 0)}
.act.off{opacity:.35}
/* Editor para colocar los botones del móvil */
#padEdit{position:fixed;inset:0;z-index:70;background:#1d4a22 repeating-linear-gradient(90deg,#3f8f3a 0 40px,#479c41 40px 80px);touch-action:none}
#padEdit .pehead{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:rgba(24,32,65,.92);border-bottom:2px solid var(--ink);display:flex;flex-direction:column;gap:6px;color:var(--chalk);font:14px var(--font-ui)}
#padEdit .pehead .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}#padEdit .pehead .ghost,#padEdit .pehead .cta{padding:6px 10px;font-size:15px;width:auto}
#padEdit .pehead input[type=range]{flex:1;min-width:120px}
#padEdit .act.pesel{box-shadow:0 0 0 3px var(--yellow),inset 0 0 0 2px rgba(10,18,40,.8)}
#padEdit .pejoy{position:absolute;left:max(22px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 30px);width:100px;height:100px;border-radius:50%;border:2px dashed rgba(242,246,236,.7);display:flex;align-items:center;justify-content:center;text-align:center;font:11px var(--font-ui);color:#fff;padding:8px;box-sizing:border-box;background:rgba(8,18,12,.3)}

.tutbox{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.tutin{max-width:360px;background:var(--navy);border:3px solid var(--ink);box-shadow:0 0 0 3px var(--yellow);padding:14px;display:flex;flex-direction:column;gap:10px;color:var(--chalk)}
.tutin p{font-size:15px;line-height:1.4;margin:0}
.mixer{display:flex;flex-direction:column;gap:8px}.mixer label{display:flex;flex-direction:column;gap:4px;font-size:16px}.mixer input{width:100%}
body.gamepad #pad,body.gamepad #stick{display:none!important}
.act.s5::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(rgba(0,0,0,.62) calc(var(--cd,0) * 360deg),transparent 0)}
.act.s5.cool{opacity:.7}

.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%);z-index:20;font-size:18px;
  background:var(--navy);border:2px solid var(--ink);box-shadow:0 0 0 2px var(--line);padding:6px 12px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .25s;color:var(--gold)}
.toast.on{opacity:1}
.banner{position:absolute;left:0;right:0;top:30%;z-index:6;text-align:center;pointer-events:none;opacity:0;transform:scale(.9);transition:opacity .2s,transform .2s;
  font-size:48px;letter-spacing:.02em;text-transform:uppercase;color:var(--yellow);padding:0 16px;text-wrap:balance;
  text-shadow:3px 0 0 #102060,-3px 0 0 #102060,0 3px 0 #102060,0 -3px 0 #102060,3px 3px 0 #102060,-3px 3px 0 #102060,3px -3px 0 #102060,-3px -3px 0 #102060,0 6px 0 rgba(0,0,0,.35)}
.banner.on{opacity:1;transform:scale(1)}
.banner.rival{color:#ffb4a8}
.banner.gold{color:#ffd23a}
.banner.flag{color:#fff;font-size:30px;text-shadow:3px 0 0 #b0201a,-3px 0 0 #b0201a,0 3px 0 #b0201a,0 -3px 0 #b0201a}
.banner.tech{font-size:36px;top:17%;color:#ffd23a;text-shadow:3px 0 0 #8a2a05,-3px 0 0 #8a2a05,0 3px 0 #8a2a05,0 -3px 0 #8a2a05,0 0 16px rgba(255,122,26,.8)}
.banner.tech.viento{color:#e6fbff;text-shadow:3px 0 0 #0d4a6a,-3px 0 0 #0d4a6a,0 3px 0 #0d4a6a,0 -3px 0 #0d4a6a,0 0 16px rgba(79,200,240,.9)}
.banner.tech.bosque{color:#e2ffa8;text-shadow:3px 0 0 #1d4d17,-3px 0 0 #1d4d17,0 3px 0 #1d4d17,0 -3px 0 #1d4d17,0 0 16px rgba(92,201,74,.9)}
.banner.tech.montana{color:#ffe6b0;text-shadow:3px 0 0 #4a2e10,-3px 0 0 #4a2e10,0 3px 0 #4a2e10,0 -3px 0 #4a2e10,0 0 16px rgba(201,143,66,.9)}
.banner.tech.rivaltech{top:auto;bottom:34%}

/* Pantallas: fondo del juego + panel azul con doble borde */
.overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:flex-start;justify-content:center;
  background:var(--night) url("ui/bg_stripes.png") repeat center top/256px auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px);overflow-y:auto;touch-action:pan-y}
.overlay.bg-cover{background-repeat:no-repeat;background-size:cover;background-position:center}
#pause.overlay{background:rgba(24,32,65,.82)}
.card{width:100%;max-width:420px;background:var(--panel);border:2px solid var(--ink);box-shadow:0 0 0 2px var(--line),0 6px 0 4px rgba(0,0,0,.35);
  padding:16px 14px;display:flex;flex-direction:column;gap:12px;margin:auto}
.card h1{margin:0;font-size:36px;line-height:1;font-weight:400;text-transform:uppercase}
.card h1 span{display:block;font-size:18px;color:var(--gold);margin-top:6px;text-transform:none}
.card h2{margin:0;font-size:24px;font-weight:400;text-wrap:balance;color:var(--yellow);text-align:center;
  background:linear-gradient(#1060e8,#0838a8);border:2px solid var(--ink);box-shadow:0 0 0 2px #6fb0ff;padding:4px 10px;
  text-shadow:2px 0 0 #081850,-2px 0 0 #081850,0 2px 0 #081850,0 -2px 0 #081850,2px 2px 0 #081850,-2px -2px 0 #081850,2px -2px 0 #081850,-2px 2px 0 #081850}
.card h3{margin:4px 0 0;font-size:18px;font-weight:400;color:var(--gold);border-bottom:2px solid var(--navy);padding-bottom:2px}
.card h3 small{display:block;color:var(--chalk);opacity:.75;font-size:12px;margin-top:2px}
.card b{font-weight:400;color:var(--gold)}
.group{display:flex;flex-direction:column;gap:6px}
.group label{font-size:12px;color:var(--sky-t)}
.opts{display:flex;gap:4px;background:var(--navy-d);border:2px solid var(--ink);padding:3px}
.opts button{flex:1;font:18px var(--font-ui);color:var(--chalk);background:transparent;border:0;padding:7px 4px;cursor:pointer}
.opts button[aria-pressed="true"]{background:var(--orange);color:#fff;box-shadow:inset 0 -3px 0 var(--orange-d)}
button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.note{font-size:12px;opacity:.9;margin:0;line-height:1.6}
.note b{color:var(--gold)}
/* Botón naranja del juego (como «Inicio» o «Superada») */
.cta{font:24px var(--font-ui);color:var(--sky-t);background:linear-gradient(var(--orange) 0 62%,var(--orange-d) 62%);
  border:2px solid var(--ink);box-shadow:0 0 0 2px var(--line);padding:9px 10px 11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
  text-shadow:2px 0 0 #204173,-2px 0 0 #204173,0 2px 0 #204173,0 -2px 0 #204173,2px 2px 0 #204173,-2px -2px 0 #204173,2px -2px 0 #204173,-2px 2px 0 #204173}
.cta small{font-size:12px;color:#fff;text-shadow:1px 1px 0 #5a2000}
.cta:active{transform:translateY(2px)}
/* Botón azul con texto dorado (como «Elegir uniforme») */
.ghost{font:18px var(--font-ui);color:var(--gold);background:var(--navy);border:2px solid var(--ink);box-shadow:0 0 0 2px var(--line);padding:8px;cursor:pointer}
.ghost:active{transform:translateY(2px)}
.keys{font-size:12px;line-height:1.6;opacity:.85;margin:0}
.keys b{color:var(--gold)}
.result{font-size:48px;text-align:center;margin:0;color:var(--yellow);display:flex;align-items:center;justify-content:center;gap:12px}
.result img{width:64px;height:64px}
.result small{display:block;font-size:12px;color:var(--chalk);opacity:.8}
.result .sc{display:flex;flex-direction:column;align-items:center}
.runbar{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:18px;align-items:center;background:var(--navy-d);border:2px solid var(--ink);padding:4px 8px}
.runbar span:first-child{color:var(--gold)}
.hearts{color:#ff5a6e;letter-spacing:2px}.hearts s{color:rgba(242,246,236,.25);text-decoration:none}
.path{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.path li{font-size:12px;padding:3px;background:var(--navy-d);border:2px solid var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;width:56px;text-align:center;opacity:.8}
.path li img{width:40px;height:40px}
.path li span{max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.path li.done{opacity:.45}.path li.done img{filter:grayscale(1)}
.path li.now{background:var(--orange);box-shadow:0 0 0 2px var(--line);opacity:1}
.vsrow{display:flex;align-items:center;gap:8px;background:var(--navy-d);border:2px solid var(--ink);padding:6px}
.vsrow img.crest{width:48px;height:48px;flex-shrink:0}
.vsrow .faces{display:flex;gap:2px;flex-wrap:wrap}
.vsrow .faces canvas{width:40px;height:40px;background:#1a2a5a;border:1px solid var(--ink)}
.vsrow b{display:block;font-size:18px}
.cards{display:flex;flex-direction:column;gap:8px}
.pcard,.rcard{display:flex;gap:10px;align-items:flex-start;background:var(--navy);border:2px solid var(--ink);box-shadow:0 0 0 2px #5a7ab8;padding:6px;text-align:left;color:var(--chalk);font-family:var(--font-ui);cursor:pointer}
.pcard.sel{box-shadow:0 0 0 2px var(--yellow);background:#3a5aa0}
.rcard{width:100%}
.rcard:hover,.rcard:focus-visible{box-shadow:0 0 0 2px var(--yellow)}
.pix{flex-shrink:0;background:linear-gradient(#3f6fc0,#1c3270);border:2px solid var(--ink)}
.pinfo{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.pname{font-size:18px;color:#fff}
.pfull{font-size:12px;color:#c8d4f0;margin:-2px 0 3px}
.pname em,.rk em{font-style:normal;font-size:12px;background:#7c4dd1;color:#fff;padding:0 4px;margin-left:4px}
.rk{font-size:12px;color:var(--gold)}
.pmeta{font-size:12px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.ptechs{display:flex;flex-direction:column;gap:2px}
.tline{display:flex;gap:5px;align-items:center;font-size:12px;flex-wrap:wrap}
.tline b{color:#fff}
.tline i{font-style:normal;opacity:.75;font-size:12px}
.ppass{font-size:12px;color:var(--sky-t)}
.chip{font-size:12px;padding:0 4px;color:#10140f;background:#ccc;border:1px solid var(--ink)}
.chip.fuego{background:var(--e-fuego)}.chip.viento{background:var(--e-viento)}.chip.bosque{background:var(--e-bosque)}.chip.montana{background:var(--e-montana)}
/* Estadísticas como la ficha del juego */
.ups{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;background:var(--navy);border:2px solid var(--ink);box-shadow:0 0 0 2px #5a7ab8;padding:6px}
.ups button{font:18px var(--font-ui);color:var(--sky-t);background:var(--navy-d);border:0;border-bottom:2px solid #62deff;padding:3px 6px;cursor:pointer;
  display:grid;grid-template-columns:1fr auto;align-items:center;text-align:left}
.ups button b{color:#fff}
.ups button small{grid-column:1/3;color:var(--gold);font-size:12px}
.ups button:disabled{opacity:.55;cursor:default}
.gains{margin:0;padding-left:18px;font-size:18px;line-height:1.6}

.cta:disabled{opacity:.45;cursor:default;transform:none}
.modes{display:flex;flex-direction:column;gap:10px}
.mode{display:flex;align-items:center;gap:10px;text-align:left;font-family:var(--font-ui);color:var(--chalk);cursor:pointer;
  background:var(--navy);border:2px solid var(--ink);box-shadow:0 0 0 2px var(--line);padding:6px 10px 6px 6px}
.mode img{width:48px;height:48px;flex-shrink:0}
.mode .mt{display:flex;flex-direction:column;gap:2px;min-width:0}
.mode b{font-size:24px;color:var(--gold);font-weight:400}
.mode small{font-size:12px}
.mode .mini{display:flex;gap:2px;flex-wrap:wrap;margin-top:2px}.mode .mini img{width:24px;height:24px}
.mode:active{transform:translateY(2px)}
.mode.locked{background:#30304a;box-shadow:0 0 0 2px #77778a;opacity:.75}.mode.locked img{filter:grayscale(1)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ghost.big{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;font-size:24px}
.ghost small,.ghost.big small{font-size:12px;color:var(--chalk);opacity:.85}
.ghost[aria-pressed="true"]{box-shadow:0 0 0 2px var(--yellow)}
.rar{font-size:12px;padding:0 4px;color:#10140f;border:1px solid var(--ink)}
.rar.comun{background:#b9c2b4}.rar.rara{background:#5aa9ff}.rar.epica{background:#b07cff}.rar.legendaria{background:linear-gradient(90deg,#ffd23a,#ff7a1a)}
.pcard.rara{box-shadow:0 0 0 2px #5aa9ff}.pcard.epica{box-shadow:0 0 0 2px #b07cff}.pcard.legendaria{box-shadow:0 0 0 2px #ffd23a}
.pcard.sel.rara,.pcard.sel.epica,.pcard.sel.legendaria{box-shadow:0 0 0 2px var(--yellow)}
.pcard.empty{justify-content:center;padding:16px;font-size:18px;color:var(--gold);border-style:dashed}
.stars{color:#ffd23a;font-size:12px;letter-spacing:1px}.stars s{color:rgba(242,246,236,.25);text-decoration:none}
.slot{font-size:12px;color:var(--gold)}
.evo{font-size:12px;opacity:.85;margin-left:4px}
.phead{display:flex;gap:12px;align-items:center}.phead h2{margin:0 0 6px;text-align:left}
.gmach{display:flex;flex-direction:column;align-items:center;gap:4px;margin:4px 0 8px}
.gmach canvas{width:192px;height:256px;image-rendering:pixelated;touch-action:none;cursor:grab;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
.gm-hint{font-size:14px;color:#ffe066;text-shadow:1px 1px 0 #000;text-align:center;animation:gmBlink 1.2s steps(2) infinite}
@keyframes gmBlink{50%{opacity:.55}}
.caps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;justify-items:center;align-items:center;min-height:70px}
.caps .gcard{width:100%;min-width:0;box-sizing:border-box;padding:3px 2px;gap:2px}
.caps .gcard:not(.solo) .pix{width:100%!important;height:auto!important;aspect-ratio:1;box-sizing:border-box}
.caps .gcard:not(.solo) .gname{font-size:9px;line-height:1.15;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.caps .gcard:not(.solo) .gmeta{font-size:8px;gap:2px;flex-wrap:wrap;justify-content:center}
.caps .gcard:not(.solo) .gmeta>span:not(.rar){display:none}
.caps .gcard:not(.solo) .gmeta .rar{font-size:8px;padding:0 2px}
.caps .gcard:not(.solo) .gtag{font-size:8px}
.caps .gcard:not(.solo) .scroll{width:100%;height:auto;aspect-ratio:1;box-sizing:border-box;font-size:22px}
.caps .gcard.solo{grid-column:1/-1;width:160px;transform-origin:center}
.caps .gcard.solo .pix{width:112px;height:112px}
.cap{position:relative;width:54px;height:54px;padding:0;border:0;background:none;cursor:pointer;animation:capDrop .45s cubic-bezier(.3,1.6,.6,1) both}
.cap.big{width:96px;height:96px;grid-column:1/-1}
.cap i{position:absolute;left:0;width:100%;height:50%;border:3px solid var(--ink);box-sizing:border-box;transition:transform .25s ease-out}
.cap .ct{top:0;border-radius:50% 50% 0 0/100% 100% 0 0;background:var(--cc);border-bottom-width:2px}
.cap .ct::after{content:'';position:absolute;left:18%;top:22%;width:22%;height:26%;background:rgba(255,255,255,.7);border-radius:50%}
.cap .cb{bottom:0;border-radius:0 0 50% 50%/0 0 100% 100%;background:#f2f2f2;border-top-width:2px}
.cap.t-comun{--cc:#b8bcc8}.cap.t-rara{--cc:#3f8fff}.cap.t-epica{--cc:#a24cff}
.cap.t-legendaria{--cc:linear-gradient(90deg,#ff4a4a,#ffcc22,#4adf6a,#3fa8ff,#b04aff,#ff4a4a);filter:drop-shadow(0 0 8px #ffd23a)}
.cap.t-legendaria .ct{background-size:300% 100%;animation:capRain 1.2s linear infinite}
.cap.t-epica{filter:drop-shadow(0 0 6px #b07cff)}
@keyframes capRain{to{background-position:300% 0}}
@keyframes capDrop{0%{transform:translateY(-120px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.cap.shake{animation:capShake .12s linear infinite}
.cap.upgrade{animation:capShake .07s linear infinite}
@keyframes capShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.cap.open .ct{transform:translateY(-60%) rotate(-25deg)}
.cap.open .cb{transform:translateY(40%) rotate(15deg)}
.gcard.fromcap{animation:capCard .35s ease-out both}
@keyframes capCard{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}
.gflash{position:fixed;inset:0;z-index:50;pointer-events:none;opacity:.55;animation:gFlash .45s ease-out forwards}
@keyframes gFlash{to{opacity:0}}
.reveal{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.gcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;background:var(--navy);border:2px solid var(--ink);box-shadow:0 0 0 2px #8a96b0;text-align:center;
  opacity:0;transform:translateY(10px) scale(.9);animation:pop .35s ease-out forwards}
.gcard .pix{width:80px;height:80px}
.gcard.rara{box-shadow:0 0 0 2px #5aa9ff}
.gcard.epica{box-shadow:0 0 0 2px #b07cff,0 0 14px rgba(176,124,255,.6)}
.gcard.legendaria{box-shadow:0 0 0 2px #ffd23a,0 0 18px rgba(255,190,58,.8)}
.gcard.legendaria .pix{background:linear-gradient(#ffd23a,#ee7300)}
.gcard.epica .pix{background:linear-gradient(#b07cff,#4a2a9a)}
.gname{font-size:12px;line-height:1.3;color:#fff}
.gmeta{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;font-size:12px;align-items:center}
.gtag{font-size:12px;color:var(--yellow)}
@keyframes pop{to{opacity:1;transform:none}}
select{font:18px var(--font-ui);color:var(--chalk);background:var(--navy-d);border:2px solid var(--ink);box-shadow:0 0 0 2px #5a7ab8;padding:6px}
select option{color:#111;font-family:system-ui}
.tracks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tracks .ghost{font-size:12px;padding:8px}
/* Modo carrera */
.cicon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.chead{display:flex;gap:10px;align-items:center;margin:10px 0}.chead b{display:block;font-size:20px;color:var(--yellow)}.chead small{font-size:12px}
.cstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:6px 0}
.cstats>div{background:rgba(10,18,48,.55);border:2px solid var(--ink);padding:4px 6px;display:flex;flex-direction:column;gap:2px}
.cstats label{font-size:12px;opacity:.8}.cstats small{font-size:12px}.cmoney{color:var(--gold);font-weight:normal}
.cbar{display:block;height:8px;background:#0a1230;border:1px solid var(--ink)}.cbar i{display:block;height:100%;background:var(--yellow)}
.cbar.ok i{background:#7ee36a}.cbar.warn i{background:#ffb03a}.cbar.bad i{background:#e04a3a}
.cweek{text-align:center;font-size:14px;margin:6px 0}.cweek b{color:var(--yellow);font-weight:normal}
.cnext{display:flex;gap:10px;align-items:center;background:rgba(31,46,104,.85);border:2px solid var(--ink);box-shadow:0 0 0 2px #5a7ab8;padding:8px 10px;margin:8px 0}
.cnext b{display:block;color:var(--gold);font-weight:normal}.cnext small{font-size:12px}
.ccrest{width:40px;height:40px;flex-shrink:0;image-rendering:pixelated;vertical-align:middle}
.ccrest.you{display:inline-flex;align-items:center;justify-content:center;font-size:24px;color:var(--yellow);background:#1f2e68;border:2px solid var(--ink);border-radius:50%;width:36px;height:36px}
.cvs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center;margin:10px 0}
.cvs>div{display:flex;flex-direction:column;align-items:center;gap:3px}.cvs b{font-weight:normal;font-size:14px}.cvs small{font-size:12px;opacity:.85}
.cvs>span{font-size:32px;color:var(--yellow)}.cvs .ccrest{width:56px;height:56px}.cvs .ccrest.you{width:52px;height:52px;font-size:30px}
.cmsg{background:rgba(10,18,48,.6);border-left:4px solid var(--yellow);padding:6px 8px}.cmsg.bad{border-color:#e04a3a}.cmsg.gold{border-color:#ffd23a;color:#fff}
.cfeed{max-height:44vh;overflow:auto}.cfeed p{margin:4px 0;font-size:14px;padding:4px 6px;background:rgba(10,18,48,.55)}.cfeed p.mine{border-left:3px solid var(--yellow)}.cfeed p.rival{border-left:3px solid #ff8a7a}
.cfeed i{color:var(--gold);font-style:normal;display:inline-block;min-width:30px}
.cres p{margin:3px 0;font-size:14px;padding:3px 6px;background:rgba(10,18,48,.45)}.cres p.you,.cres p.now{background:rgba(255,210,58,.18)}.cres b{color:var(--yellow);font-weight:normal}
.ccal p{display:flex;align-items:center;gap:6px}.ccal i{font-style:normal;color:var(--gold);min-width:30px}.ccal .ccrest{width:24px;height:24px}.ccal .ccrest.you{width:22px;height:22px;font-size:14px}
.ctable{width:100%;border-collapse:collapse;font-size:12px}.ctable th{color:var(--gold);font-weight:normal;padding:2px}.ctable td{padding:2px 3px;text-align:center;background:rgba(10,18,48,.45)}
.ctable td.tn{text-align:left;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ctable .ccrest{width:20px;height:20px}.ctable .ccrest.you{width:18px;height:18px;font-size:12px}
.ctable tr.you td{background:rgba(255,210,58,.25)}.ctable tr.zup td:first-child{box-shadow:inset 3px 0 0 #7ee36a}.ctable tr.zdown td:first-child{box-shadow:inset 3px 0 0 #e04a3a}
.ckey .zup{color:#7ee36a}.ckey .zdown{color:#e04a3a}
.cmgrs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.cmgr{display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(10,18,48,.55);border:2px solid var(--ink);padding:6px;color:var(--chalk);font:12px var(--font-ui);cursor:pointer;width:96px}
.cmgr.sel{box-shadow:0 0 0 3px var(--yellow)}
.cmgr small{font-size:10px;color:#ffb44a}.cmgr.ray{background:rgba(40,10,40,.75)}.cmgr img.mgrcrest{width:64px;height:64px;image-rendering:pixelated}
.chead img.mgrcrest{width:40px;height:40px}
/* ---------- Halloween ---------- */
.mode.hwmode{background:linear-gradient(90deg,#3a1458,#5a1f2a);box-shadow:0 0 0 2px #ff8a1a,0 0 14px rgba(255,138,26,.35)}
.mode.hwmode b{color:#ffa23a}
.hwdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff5a2a;box-shadow:0 0 6px #ff8a1a;vertical-align:middle;margin-left:4px}
#screen.hwtheme{background-color:#1a0a26}
#screen.hwtheme .card{position:relative;z-index:1;background:linear-gradient(rgba(42,16,62,.93),rgba(26,10,40,.93));box-shadow:0 0 0 2px #ff8a1a,0 6px 0 4px rgba(0,0,0,.4)}
#screen.hwtheme .card h2,#screen.hwtheme .card h3{color:#ffa23a}
.hwfx{position:absolute;left:0;right:0;top:0;height:100%;pointer-events:none;z-index:2;overflow:hidden}
.hwfx .fog{position:absolute;left:-30%;width:160%;height:28%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(225,215,250,.13),transparent 70%);filter:blur(6px);animation:hwfog 18s ease-in-out infinite alternate}
.hwfx .f1{top:12%}.hwfx .f2{top:48%;animation-duration:24s;animation-delay:-6s}.hwfx .f3{bottom:-4%;animation-duration:20s;animation-delay:-12s}
@keyframes hwfog{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
.hwfx .pk{position:absolute;top:2px;font-size:26px;filter:drop-shadow(0 0 8px rgba(255,138,26,.7));animation:hwglow 2.6s ease-in-out infinite alternate}
.hwfx .p1{left:2px}.hwfx .p2{right:2px;font-size:22px;animation-delay:-1s}
@keyframes hwglow{from{filter:drop-shadow(0 0 4px rgba(255,138,26,.4))}to{filter:drop-shadow(0 0 12px rgba(255,138,26,.9))}}
@media (prefers-reduced-motion:reduce){.hwfx *{animation:none!important}}
.hwbar span:last-child{color:#ffa23a}
.hwlegs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.hwleg{display:flex;flex-direction:column;align-items:center;width:72px;padding:4px;background:rgba(10,4,20,.55);border:2px solid #ffcc22;text-align:center}
.hwleg small{font-size:10px;line-height:1.1}.hwleg canvas{filter:grayscale(.3) brightness(.8)}.hwleg.own canvas{filter:none}.hwleg.own{box-shadow:0 0 8px #ffcc22}
.hwretos{display:flex;flex-direction:column;gap:6px}
.gtable{width:100%;border-collapse:collapse;font-size:13px;line-height:1.35;background:rgba(10,18,48,.55);border:2px solid var(--ink)}
.gtable th{font-weight:400;color:var(--gold);text-align:left;padding:4px 6px;border-bottom:2px solid var(--ink)}
.gtable td{padding:4px 6px;border-top:1px solid rgba(255,255,255,.08);vertical-align:top}.gtable td:first-child{white-space:nowrap}.gtable td b{color:var(--yellow);font-weight:400}
.gtips{margin:0;padding-left:18px;font-size:14px;line-height:1.45}
.newdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff5a2a;vertical-align:middle;margin-left:4px;box-shadow:0 0 6px #ff8a1a}
.newsv{background:rgba(10,18,48,.55);border:2px solid var(--ink);padding:6px 10px}.newsv.last{box-shadow:0 0 0 2px var(--yellow)}
.newsv h3{margin:2px 0 4px}.newsv h3 small{font-size:12px;color:var(--chalk)}.newtag{font-size:12px;background:var(--yellow);color:#000;padding:1px 6px;margin-left:6px}
.newsv ul{margin:0;padding-left:18px;font-size:14px;line-height:1.45}.newsv li{margin:3px 0}
.hwlogin{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.hwday{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;background:rgba(10,4,20,.5);border:2px solid #5a2a7a;text-align:center;min-width:0}
.hwday span{font-size:22px}.hwday small{font-size:9px;line-height:1.1}.hwday small:first-child{font-size:11px;color:#ffa23a}
.hwday.ready{border-color:#ff8a1a;box-shadow:0 0 10px rgba(255,138,26,.6)}.hwday.got{opacity:.55}.hwday.locked{opacity:.85}
.hwpick{display:flex;flex-direction:column;gap:8px}
.hwpk{display:grid;grid-template-columns:72px 1fr;grid-template-rows:auto auto auto;column-gap:10px;align-items:center;text-align:left;background:rgba(10,4,20,.6);border:2px solid #ffcc22;padding:6px;color:var(--chalk);font:14px var(--font-ui);cursor:pointer}
.hwpk canvas{grid-row:1/4}.hwpk b{color:#ffa23a;font-weight:400;font-size:18px}.hwpk small{font-size:12px}
.hwreto{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:6px 8px;background:rgba(10,4,20,.5);border:2px solid #5a2a7a}
.hwreto div{display:flex;flex-direction:column;gap:2px}.hwreto small{font-size:12px}.hwreto b{color:#ffa23a;font-weight:400}
.hwreto .cta{width:auto;padding:6px 10px;font-size:14px}.hwreto.ready{border-color:#ff8a1a}.hwreto.got{opacity:.7}
.hwok{font-size:24px;color:#6fe06f}
.ghost.discordbtn{background:linear-gradient(#5865f2,#4752c4);color:#fff;box-shadow:0 0 0 2px #2b2f7a}
.kmap{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kbtn{display:flex;justify-content:space-between;align-items:center;gap:6px;background:rgba(10,18,48,.55);border:2px solid var(--ink);padding:6px 8px;color:var(--chalk);font:14px var(--font-ui);cursor:pointer;text-align:left;min-width:0}
.kbtn span{min-width:0;overflow:hidden;text-overflow:ellipsis}.kbtn b{font-weight:400;color:var(--yellow);background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.25);padding:1px 7px;white-space:nowrap}
.kbtn.dup{border-color:#ff5a5a}.kbtn.dup b{color:#ff8a8a}.kbtn.wait{box-shadow:0 0 0 2px var(--yellow)}.kbtn.wait b{color:#fff;animation:hwglow 1s ease-in-out infinite alternate}
.kdup{color:#ff8a8a}
/* Legendarios de Halloween: marco naranja apagado y brillo morado (en vez del dorado) */
.gcard.legendaria.hw{box-shadow:0 0 0 2px #9a4a16,0 0 18px rgba(110,30,150,.75);filter:saturate(.8)}
.gcard.legendaria.hw .pix,.ptile.legendaria.hw .pix{background:linear-gradient(#a8561c,#3a1446)}
.pcard.legendaria.hw,.ptile.legendaria.hw{box-shadow:0 0 0 2px #9a4a16,0 0 8px rgba(110,30,150,.6)}
.gcard.epica.hw{box-shadow:0 0 0 2px #5a2a86,0 0 18px rgba(60,200,90,.6)}
.gcard.epica.hw .pix,.ptile.epica.hw .pix{background:linear-gradient(#6a3a9a,#14261a)}
.pcard.epica.hw,.ptile.epica.hw{box-shadow:0 0 0 2px #5a2a86,0 0 8px rgba(60,200,90,.55)}
.pslot.legendaria.hw .pf{box-shadow:0 0 0 2px #9a4a16,0 0 6px rgba(110,30,150,.6);background:linear-gradient(#a8561c,#3a1446)}
.hw .rar.legendaria{background:linear-gradient(90deg,#a8561c,#5a1f6a);color:#f3d9c0}
.hwleg{border-color:#9a4a16}.hwleg.own{box-shadow:0 0 8px rgba(110,30,150,.8)}
.csquad{display:flex;flex-direction:column;gap:6px}
.cpl{display:flex;gap:8px;align-items:center;text-align:left;background:rgba(31,46,104,.8);border:2px solid var(--ink);padding:5px;color:var(--chalk);font:14px var(--font-ui);cursor:pointer}
.cpl.sel{box-shadow:0 0 0 2px var(--yellow)}.cpl b{font-weight:normal;color:var(--gold)}.cpl small{font-size:12px}.cpl .cst{display:block;font-size:12px;opacity:.9}.cpl .cst b{color:#fff}
.ccrest.big{width:48px;height:48px}.ccrest.huge{width:72px;height:72px}
.chead #cMgr canvas{border-radius:50%}
.cnav{margin-top:12px}
.cnext.vencido{border-color:var(--yellow);box-shadow:0 0 0 2px var(--yellow)}.cnext.vencido .cta{margin-top:6px;width:auto;padding:4px 10px;font-size:18px}
.cpl.btn{cursor:pointer}.cplb{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.cpl .mini,.cta.mini,.ghost.mini{width:auto;margin:4px 0 0;padding:4px 10px;font-size:14px;align-self:flex-start}
.cpl.fac{align-items:center}.cpl.fac .cta.mini{margin:0;flex-shrink:0}
.row2{display:flex;gap:6px;flex-wrap:wrap}
.negbox{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0}.negbox b{font-size:24px;color:var(--yellow);font-weight:normal;min-width:110px;text-align:center}.negbox .ghost{width:auto;padding:6px 12px}
.swatches{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px}
.sw{width:30px;height:30px;border:2px solid var(--ink);box-shadow:0 0 0 1px #5a7ab8;cursor:pointer;padding:0}.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--yellow)}
.clubpv{display:flex;align-items:center;gap:12px;justify-content:center;margin:8px 0}.clubpv b{display:block;color:var(--yellow);font-weight:normal;font-size:20px}.clubpv small{font-size:14px}
.kitpv{background:rgba(10,18,48,.5);border:2px solid var(--ink)}
.syms button{font-size:18px}
textarea#sCode,textarea#tCode{width:100%;box-sizing:border-box;margin:8px 0;font:16px monospace;color:var(--chalk);background:var(--navy-d);border:2px solid var(--ink);box-shadow:0 0 0 2px #5a7ab8;padding:6px;-webkit-user-select:text;user-select:text;touch-action:manipulation;resize:vertical}
.ctable tr.zpo td:first-child{box-shadow:inset 3px 0 0 #ffd23a}.ckey .zpo{color:#ffd23a}
/* PC: sin controles en pantalla, campo más ancho y ayuda de teclas */
.pc #shell{max-width:760px}
.pc #pad,.pc #stick{display:none!important}
#keyhud{display:none}
.pc #keyhud:not([hidden]){display:flex;position:absolute;z-index:3;left:12px;right:12px;bottom:10px;gap:8px;align-items:flex-end;justify-content:space-between;pointer-events:none}
.kh-keys{font-size:12px;line-height:1.5;background:rgba(10,18,48,.72);border:2px solid var(--ink);padding:3px 8px;color:var(--chalk);max-width:62%}
.kh-keys b,.kh-tech b{color:var(--gold);font-weight:normal}
.kh-tech{position:relative;overflow:hidden;font-size:12px;background:rgba(238,115,0,.85);border:2px solid #ffd08a;padding:4px 10px;color:#fff;white-space:nowrap;max-width:38%;text-overflow:ellipsis}
.kh-tech[data-elem="viento"]{background:rgba(10,70,100,.85);border-color:var(--e-viento)}
.kh-tech[data-elem="bosque"]{background:rgba(20,80,20,.85);border-color:var(--e-bosque)}
.kh-tech[data-elem="montaña"]{background:rgba(90,56,18,.85);border-color:var(--e-montana)}

.kh-tech span,.kh-tech b{position:relative;z-index:1}
.kh-tech.off{opacity:.4;background:rgba(10,18,48,.72);border-color:var(--ink)}
.kh-tech.ready{box-shadow:0 0 0 2px var(--yellow)}
.pc button:not(:disabled):hover{filter:brightness(1.15)}
.giftin{display:flex;gap:8px;margin:10px 0}
.giftin input{flex:1;min-width:0;font:18px var(--font-ui);color:var(--chalk);background:var(--navy-d);border:2px solid var(--ink);box-shadow:0 0 0 2px #5a7ab8;padding:8px;text-transform:uppercase;-webkit-user-select:text;user-select:text;touch-action:manipulation}
.giftin .cta{width:auto;margin:0;padding:8px 14px}
.giftmsg{min-height:24px;font-size:14px;margin:4px 0}.giftmsg.ok{color:var(--yellow)}.giftmsg.bad{color:#ffb4a8}
/* Intro */
#intro .in-mach{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;padding-bottom:22%}
#intro .in-mach canvas{width:28%;max-width:150px;image-rendering:pixelated;animation:capDrop .5s cubic-bezier(.3,1.6,.6,1) both}
#intro{position:fixed;inset:0;z-index:50;background:#000;overflow:hidden;cursor:pointer;-webkit-user-select:none;user-select:none}
#intro .in-stage{position:absolute;inset:0;z-index:0}
.in-slide{position:absolute;inset:0;background:#000;overflow:hidden;animation:inFade .7s ease-out both}
.in-bg{position:absolute;inset:-10%;background:center/cover no-repeat;filter:blur(10px) brightness(.45) saturate(1.2)}
.in-fg{position:absolute;inset:0;background:center/contain no-repeat;image-rendering:pixelated}
@media (min-aspect-ratio:4/3){.in-fg{background-size:cover}}
.in-fg.kbA{animation:kbA 4.2s linear both}
.in-fg.kbB{animation:kbB 4.2s linear both}
.in-fg.kbZoom{background-size:cover;animation:kbZ 2.4s ease-out both}
@keyframes inFade{from{opacity:0}to{opacity:1}}
@keyframes kbA{from{transform:scale(1.02) translate(1%,1%)}to{transform:scale(1.16) translate(-2%,-1%)}}
@keyframes kbB{from{transform:scale(1.16) translate(-2%,1%)}to{transform:scale(1.03) translate(1%,-1%)}}
@keyframes kbZ{from{transform:scale(1.6) rotate(-4deg)}to{transform:scale(1.05) rotate(0)}}
.in-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;background:radial-gradient(circle at 50% 45%,#1f2e68 0,#000 70%);animation:inFade .6s both}
.in-logo{width:min(92vw,560px);height:auto;image-rendering:auto;filter:drop-shadow(0 4px 0 rgba(0,0,0,.5))}
.in-logo.slam{animation:slam .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slam{from{transform:scale(2.6);opacity:0}to{transform:none;opacity:1}}
.in-sub{font-size:18px;color:#fff;margin:0}
.in-tap{font-size:18px;color:var(--yellow);margin:0;animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.in-cap{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 12%);z-index:3;text-align:center;font-size:20px;color:#fff;opacity:0;pointer-events:none;
  text-shadow:2px 0 0 #000,-2px 0 0 #000,0 2px 0 #000,0 -2px 0 #000,2px 2px 0 #000,-2px 2px 0 #000,2px -2px 0 #000,-2px -2px 0 #000}
.in-cap.on{animation:capIn .5s ease-out .2s both}
.in-cap b{display:block;font-weight:normal;font-size:30px;line-height:1.1;color:var(--yellow);text-transform:uppercase;letter-spacing:1px;
  text-shadow:3px 0 0 #8a2a05,-3px 0 0 #8a2a05,0 3px 0 #8a2a05,0 -3px 0 #8a2a05,3px 3px 0 #8a2a05,-3px 3px 0 #8a2a05,3px -3px 0 #8a2a05,-3px -3px 0 #8a2a05,0 0 18px rgba(255,122,26,.7);
  animation:capSlam .45s cubic-bezier(.2,1.6,.4,1) .2s both}
.in-cap small{display:block;margin-top:8px;font-size:18px;color:#fff}
@keyframes capSlam{from{transform:scale(1.8);opacity:0}to{transform:none;opacity:1}}
.in-crests{grid-template-columns:repeat(4,48px)!important;z-index:2}
.in-crests img{width:48px;height:48px;image-rendering:pixelated;animation:pop .35s cubic-bezier(.2,1.6,.4,1) backwards;transform:scale(.3);opacity:0;animation-fill-mode:forwards;filter:drop-shadow(0 2px 0 rgba(0,0,0,.6))}
@keyframes capIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.in-flash{position:absolute;inset:0;z-index:4;background:#fff;opacity:0;pointer-events:none}
.in-flash.on{animation:flashA .5s ease-out}
@keyframes flashA{from{opacity:.95}to{opacity:0}}
.in-skip{position:absolute;z-index:5;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;font-size:14px;padding:6px 10px}
.in-faces{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,64px);gap:10px;justify-content:center;align-content:center}
.in-faces canvas{animation:pop .35s cubic-bezier(.2,1.6,.4,1) backwards;transform:scale(.3);opacity:0;animation-fill-mode:forwards}
details.tgroup,details.roles{margin:6px 0;border:2px solid var(--ink);background:rgba(10,18,48,.4);padding:6px 8px}
details.tgroup summary,details.roles summary{cursor:pointer;font-size:14px;color:var(--yellow)}
details.tgroup .tracks{margin-top:8px}
/* Portada */
.title{display:flex;flex-direction:column;align-items:center;gap:4px;margin:-4px 0 0}
.title img.logo{width:100%;max-width:440px;height:auto;cursor:pointer;image-rendering:auto;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35));margin-top:6px}
.title span{font-size:18px;color:#fff}
.hero{display:block;width:calc(100% + 28px);margin:-16px -14px 0;height:auto;border-bottom:2px solid var(--ink)}
.finimg{display:block;width:100%;max-width:384px;margin:0 auto;height:auto}
.cardbg-clear{background:rgba(24,32,65,.72)}
/* Barras fijas y cuadrícula de jugadores */
.top{position:sticky;top:-16px;z-index:4;display:flex;gap:8px;align-items:center;margin:-16px -14px 0;padding:10px 14px 8px;background:#1d2752;border-bottom:2px solid var(--ink)}
.top h2{flex:1;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .back{padding:6px 8px;font-size:18px;flex-shrink:0}
.bottom{position:sticky;bottom:-16px;z-index:4;margin:0 -14px -16px;padding:10px 14px 12px;background:#1d2752;border-top:2px solid var(--ink);display:flex;flex-direction:column;gap:8px}
.bottom:empty{display:none}
.pfbar{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.pfq{display:flex;gap:6px}.pfq input{flex:1;min-width:0;font:18px var(--font-ui);color:var(--chalk);background:var(--navy-d);border:2px solid var(--ink);box-shadow:0 0 0 2px #5a7ab8;padding:7px 8px}
.pfq input::placeholder{color:#8a96b0}.pfq button{padding:4px 12px;font-size:18px}
.pfsel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.pfsel select{min-width:0;font-size:16px;padding:5px 4px}
.sortrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px}
.opts.small{padding:2px}.opts.small button{font-size:12px;padding:4px 6px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.ptile{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;background:var(--navy);border:2px solid var(--ink);box-shadow:0 0 0 2px #5a7ab8;color:var(--chalk);font-family:var(--font-ui);cursor:pointer;text-align:center;min-width:0}
.ptile .tn{font-size:12px;line-height:1.25;color:#fff;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptile .tm{display:flex;gap:4px;align-items:center;font-size:12px}.ptile .tm i{font-style:normal;color:var(--sky-t)}
.ptile.rara{box-shadow:0 0 0 2px #5aa9ff}.ptile.epica{box-shadow:0 0 0 2px #b07cff}.ptile.legendaria{box-shadow:0 0 0 2px #ffd23a}
.ptile.legendaria .pix{background:linear-gradient(#ffd23a,#ee7300)}.ptile.epica .pix{background:linear-gradient(#b07cff,#4a2a9a)}
.ptile.sel{background:#3a5aa0;box-shadow:0 0 0 2px var(--yellow)}
.ptile:active{transform:translateY(2px)}
/* Supertécnicas: franjas de cine y presentación con retrato */
#cine .lb{position:absolute;left:0;right:0;height:0;background:#000;z-index:4;transition:height .22s ease-out;pointer-events:none}
#cine .lb.t{top:0}#cine .lb.b{bottom:0}
#shell.cine #cine .lb{height:8%}
#shell.cine .hud{opacity:.25;transition:opacity .2s}
.cutin{position:absolute;left:0;right:0;top:19%;z-index:7;pointer-events:none;display:none;overflow:hidden;padding:14px 0}
.cutin.on{display:block}
.cutin .ci-in{display:flex;align-items:center;gap:12px;margin:0 -24px;padding:8px 36px;transform:skewY(-5deg);
  border-top:3px solid #fff;border-bottom:3px solid #fff;box-shadow:0 0 0 3px var(--c3),0 8px 24px rgba(0,0,0,.5);
  background:linear-gradient(90deg,var(--c3),var(--c2) 45%,var(--c1));animation:ciIn .22s cubic-bezier(.2,.9,.3,1.2) both}
.cutin.rival{top:auto;bottom:22%}
.cutin.rival .ci-in{flex-direction:row-reverse;text-align:right;transform:skewY(5deg);animation-name:ciInR;background:linear-gradient(270deg,var(--c3),var(--c2) 45%,var(--c1))}
.cutin.out .ci-in{animation:ciOut .24s ease-in both}
.cutin.rival.out .ci-in{animation:ciOutR .24s ease-in both}
@keyframes ciIn{from{transform:translateX(-115%) skewY(-5deg)}to{transform:translateX(0) skewY(-5deg)}}
@keyframes ciInR{from{transform:translateX(115%) skewY(5deg)}to{transform:translateX(0) skewY(5deg)}}
@keyframes ciOut{to{opacity:0;transform:translateX(40%) skewY(-5deg)}}
@keyframes ciOutR{to{opacity:0;transform:translateX(-40%) skewY(5deg)}}
.ci-face{flex-shrink:0;line-height:0}.ci-face canvas{border:3px solid #fff;box-shadow:0 0 0 2px var(--c3);background:rgba(0,0,0,.3)}
.ci-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.ci-txt small{font-size:12px;color:#fff;opacity:.95}
.ci-txt b{font-size:36px;line-height:1.05;font-weight:400;color:#fff;animation:ciName .5s ease-out both;
  text-shadow:3px 0 0 var(--c3),-3px 0 0 var(--c3),0 3px 0 var(--c3),0 -3px 0 var(--c3),3px 3px 0 var(--c3),-3px -3px 0 var(--c3),3px -3px 0 var(--c3),-3px 3px 0 var(--c3),0 6px 0 rgba(0,0,0,.4)}
@keyframes ciName{from{letter-spacing:.4em;opacity:0}to{letter-spacing:0;opacity:1}}
.cutin.fuego{--c1:#ffd23a;--c2:#ff6a10;--c3:#7a1404}
.cutin.viento{--c1:#d2f7ff;--c2:#2fa6e0;--c3:#0b2f5e}
.cutin.bosque{--c1:#e2ffa8;--c2:#46ad35;--c3:#174212}
.cutin.montana{--c1:#ffe6b0;--c2:#b07434;--c3:#432a0e}
.cutin.neutro{--c1:#ffffff;--c2:#6a7a9a;--c3:#1d2752}
/* Pizarra de alineación */
.edbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.edbar .ghost{padding:6px 10px}
.pitch{position:relative;width:100%;aspect-ratio:34/37;border:2px solid var(--ink);box-shadow:0 0 0 2px var(--line);overflow:hidden;
  background:repeating-linear-gradient(180deg,#3f8f3a 0 12.5%,#479c41 12.5% 25%)}
.pitch i{position:absolute;border:2px solid rgba(242,246,236,.75);pointer-events:none}
.pitch .pl-mid{left:-2px;right:-2px;top:-2px;height:0;border-width:0 0 2px}
.pitch .pl-circle{left:50%;top:0;width:32%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%)}
.pitch .pl-box{left:23%;right:23%;bottom:-2px;height:24%}
.pitch .pl-small{left:37%;right:37%;bottom:-2px;height:9%}
.pslot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;padding:0;cursor:pointer;color:#fff;font-family:var(--font-ui);width:80px}
.pslot .pf{width:46px;height:46px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#3f6fc0,#1c3270);border:2px solid var(--ink);box-shadow:0 0 0 2px #fff;font-size:24px;color:var(--gold)}
.pslot .pf canvas{border:0;background:none}
.pslot.empty .pf{background:rgba(0,0,0,.35);box-shadow:0 0 0 2px var(--gold);border-style:dashed}
.pslot.rara .pf{box-shadow:0 0 0 2px #5aa9ff}.pslot.epica .pf{box-shadow:0 0 0 2px #b07cff}.pslot.legendaria .pf{box-shadow:0 0 0 2px #ffd23a;background:linear-gradient(#ffd23a,#ee7300)}
.pslot.sel .pf{box-shadow:0 0 0 3px var(--yellow),0 0 14px 4px rgba(255,232,26,.8);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.pslot .pr{font-size:12px;background:var(--navy-d);border:1px solid var(--ink);padding:0 4px;color:var(--sky-t);margin-top:2px}
.pslot .pn{font-size:12px;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptile .slot{font-size:12px}
/* Versiones del Infinito: marco turquesa y morado con el símbolo ∞ (en todas las rarezas) */
.gcard.inf,.pcard.inf,.ptile.inf,.pslot.inf .pf{position:relative;box-shadow:0 0 0 2px #2fd0c8,0 0 0 4px #6a3ad8,0 0 10px rgba(80,220,210,.55)}
.gcard.inf .pix,.ptile.inf .pix{background:linear-gradient(135deg,#1aa8a0,#5a2ab8)}
.gcard.inf::after,.pcard.inf::after,.ptile.inf::after,.pslot.inf .pf::after{content:'∞';position:absolute;top:1px;right:3px;font:700 15px/1 var(--font-ui);color:#7ff5ee;text-shadow:0 0 4px #6a3ad8,1px 1px 0 #000;pointer-events:none}
.hwpk.infpk{border-color:#2fd0c8;box-shadow:0 0 0 2px #6a3ad8}
.opts.kitdz{display:grid;grid-template-columns:repeat(3,1fr)}
.pslot .pe{display:block;line-height:1}.pslot .pe .chip{font-size:9px;padding:0 3px}
.tmp{font-style:normal;font-size:12px;background:#7c4dd1;color:#fff;padding:0 3px}
.pgrid > .note{grid-column:1/-1}
details.techs summary{cursor:pointer;color:var(--gold);font-size:18px;padding:6px 0}
details.techs .cards{margin-top:6px}
/* Gachas y técnicas */
.banners{display:flex;flex-direction:column;gap:10px}
.banner-card{display:flex;align-items:center;gap:10px;text-align:left;font-family:var(--font-ui);color:var(--chalk);cursor:pointer;background:var(--navy);border:2px solid var(--ink);box-shadow:0 0 0 2px #5a7ab8;padding:6px 10px 6px 6px}
.banner-card img.crest{width:48px;height:48px;flex-shrink:0}
.banner-card b{font-size:24px;color:var(--gold);font-weight:400}
.banner-card small{font-size:12px}
.banner-card .legs{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}.banner-card .legs canvas{border:1px solid #ffd23a;background:linear-gradient(#ffd23a,#ee7300)}
.banner-card .mt{display:flex;flex-direction:column;gap:2px;min-width:0;overflow-wrap:anywhere}
.banner-card.sel{background:#3a5aa0;box-shadow:0 0 0 3px var(--yellow),0 0 14px rgba(255,232,26,.45)}
.bottom .grid2 .cta{padding:8px 6px 10px}
.scroll{width:80px;height:80px;display:flex;align-items:center;justify-content:center;font-size:40px;border:2px solid var(--ink);
  background:radial-gradient(circle,#fff6c0,#ffd23a 45%,#ee7300);box-shadow:inset 0 0 0 3px rgba(255,255,255,.5)}
.scroll.small{width:44px;height:44px;font-size:22px;flex-shrink:0}
.techcard.viento .scroll,.techrow.viento .scroll{background:radial-gradient(circle,#fff,#8fe9ff 45%,#2fa6e0)}
.techcard.bosque .scroll,.techrow.bosque .scroll{background:radial-gradient(circle,#f4ffd8,#9ee860 45%,#46ad35)}
.techcard.montana .scroll,.techrow.montana .scroll{background:radial-gradient(circle,#fff4dc,#e0aa60 45%,#ae7232)}
.techcard.fuego .scroll,.techrow.fuego .scroll{background:radial-gradient(circle,#fff6c0,#ffc23a 45%,#ff6a10)}
.eqslots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.eqslot,.eqopt{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;font-family:var(--font-ui);color:var(--chalk);cursor:pointer;background:var(--navy-d);border:2px solid var(--ink);box-shadow:0 0 0 2px #5a7ab8;padding:6px}
.eqslot i,.eqopt i{font-style:normal;font-size:12px;color:var(--sky-t)}
.eqslot.sel{box-shadow:0 0 0 3px var(--yellow);background:#3a5aa0}
.eqlist{display:flex;flex-direction:column;gap:6px}
.eqopt.on{opacity:.6}
.eqopt.leg{box-shadow:0 0 0 2px #ffd23a}
/* Banner, versión y modo desarrollador */
.ver{align-self:flex-end;margin:-4px -4px -8px 0;font:12px var(--font-ui);color:rgba(255,255,255,.55);background:none;border:0;padding:6px;cursor:pointer}
.dbg{position:absolute;left:8px;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:8;margin:0;pointer-events:none;
  font:12px/1.4 var(--font-ui);color:#7fff7f;background:rgba(0,0,0,.6);padding:4px 6px;white-space:pre-wrap;max-width:70%}
@media (prefers-reduced-motion:reduce){.toast,.act,.banner{transition:none}.gcard{animation:none;opacity:1;transform:none}.cap,.gm-hint,.cap .ct{animation:none!important}}
/* Cuenta y guardado en la nube */
.cloudst{font-size:13px;margin:6px 0 0;padding:6px 8px;background:rgba(10,18,48,.7);border:2px solid var(--ink);line-height:1.5;cursor:pointer}
.cloudst.ok{color:#bff5c8}.cloudst.warn{color:#ffd9a8;box-shadow:0 0 0 2px #b8742a}.cloudst b{color:var(--yellow);font-weight:normal}
.aform{display:flex;flex-direction:column;gap:10px;margin:4px 0}
.aform label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--gold)}
.aform input[type=text],.aform input[type=password]{font:18px var(--font-ui);color:var(--chalk);background:var(--navy-d);border:2px solid var(--ink);box-shadow:0 0 0 2px #5a7ab8;padding:10px 8px;-webkit-user-select:text;user-select:text;touch-action:manipulation;border-radius:0}
.aform input::placeholder{color:#8a96b0}
.aform .showpw{flex-direction:row;align-items:center;gap:8px;color:var(--chalk);font-size:13px}
.aform .showpw input{width:20px;height:20px;margin:0}
.tabs .ghost{font-size:16px}
details.adv{margin-top:10px;background:rgba(10,18,48,.55);border:2px solid var(--ink);padding:6px 8px}
details.adv summary{cursor:pointer;color:var(--gold);font-size:15px;padding:4px 0}
details.adv[open]{display:flex;flex-direction:column;gap:8px}
.cpl.conf{width:100%;padding:10px;margin:6px 0}.cpl.conf b{font-size:18px}
.steps{margin:4px 0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.5}
.steps b{color:var(--yellow);font-weight:normal}
.linkbtn{display:block;text-align:center;text-decoration:none;margin-top:6px}
#sLink,#aOld,#wOld{display:flex;flex-direction:column;align-items:center;gap:2px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;font:18px var(--font-ui);color:#1f1f1f;background:#fff;border:2px solid var(--ink);box-shadow:0 0 0 2px #dadce0;cursor:pointer}
.gbtn svg{width:22px;height:22px;flex-shrink:0}.gbtn:active{transform:translateY(2px)}.gbtn:disabled{opacity:.6}
.gsep{display:flex;align-items:center;gap:8px;font-size:12px;opacity:.85;margin:4px 0}.gsep:before,.gsep:after{content:"";flex:1;border-top:2px solid rgba(255,255,255,.25)}
/* Sin zoom: ningún campo de texto por debajo de 16 px (el iPhone hace zoom al tocarlos) y sin doble toque */
input,textarea,select{font-size:max(16px,1em)}
html,body,button,.act,#shell{touch-action:manipulation}
#touch,.act,.gmach canvas{touch-action:none}
</style>
